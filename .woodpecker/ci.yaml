# CI mínimo (QUARK-289 F5): build e testes que o repo já tem, no push de branch.
# -----------------------------------------------------------------------------
# QTZ-2388: roda só no push de branch. O push testa o mesmo commit que o PR
# testaria (o status do GitHub é por commit) e o SHA verde pousa na main por
# fast-forward, então nem o pull_request nem o push na main testam de novo.
# -----------------------------------------------------------------------------
when:
  - event: push
    branch:
      exclude: [main]
  - event: manual

steps:
  - name: install
    image: node:22-bookworm@sha256:8a34c4ab3ea2c5cd194f07e317b2a8f09461d3c8b05c4e34c8ccd56d56024c4d
    commands:
      - npm ci
  - name: typecheck
    image: node:22-bookworm@sha256:8a34c4ab3ea2c5cd194f07e317b2a8f09461d3c8b05c4e34c8ccd56d56024c4d
    commands:
      - npx prisma generate
      - npm run typecheck
  - name: test
    image: node:22-bookworm@sha256:8a34c4ab3ea2c5cd194f07e317b2a8f09461d3c8b05c4e34c8ccd56d56024c4d
    commands:
      - npm test
  - name: build
    image: node:22-bookworm@sha256:8a34c4ab3ea2c5cd194f07e317b2a8f09461d3c8b05c4e34c8ccd56d56024c4d
    commands:
      - npm run build
